# Shared roots must exist before systemd constructs service namespaces.
# RuntimeDirectory=/StateDirectory= on the application units apply the
# service-account ownership required by /run/boudyos and app-status.
d /opt/boudyos 0755 root root -
# Native activation has no /opt selector; remove a stale pre-2.2 symlink/file.
r /opt/boudyos/current - - - -
d /var/lib/boudyos 0755 root root -
d /var/lib/boudyos/status 0755 root root -
d /run/boudyos 0755 root root -
d /run/lock/boudyos 0750 root root -
d /var/backups/boudyos 0700 root root -
