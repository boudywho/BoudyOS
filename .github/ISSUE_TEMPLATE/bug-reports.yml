name: Bug Report
description: Report a reproducible BoudyOS defect without secrets
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: Optional contact. Do not include private Telegram identifiers.
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What BoudyOS version are you running?
      options:
        - "2.2.0"
        - "2.1.2"
        - "Development checkout"

    validations:
      required: true
  - type: dropdown
    id: hosted
    attributes:
      label: Hosted On
      description: Which BoudyOS deployment method are you using?
      options:
        - Native systemd
        - Docker
        - VPS (manual)
        - Heroku
        - Railway
        - Termux
        - Other
        - Not deployed yet
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs output
      description: Include only the smallest manually sanitized excerpt; do not paste raw logs.
      placeholder: Remove tokens, sessions, URLs/passwords, paths, chat IDs, and private identifiers.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgement
      description: Confirm that the report follows the BoudyOS support and security guidance.
      options:
        - label: I removed secrets and private identifiers and reviewed SUPPORT.md.
          required: true
